<!DOCTYPE html>
<html lang="es" dir="ltr" data-theme="light">

<head>

  <meta charset="utf-8">
  <title>Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="stylesheet" href="../views/styles/chat.css">

  <script src="../scripts/chat.js"></script>

</head>

<body>
  
  <section class="chatsection">

    <div class="chathead">
      <div>
        <img src="https://krono-shop.com/media/image/f8/bf/af/0125-BS_1280x1280.jpg" alt="imagen de la persona">
        <h1>Damián Sala</h1>
      </div>

      <div>
        <a href="">  <span class="material-symbols-outlined">search</span> </a>
        <a href=""> <span class="material-symbols-outlined">more_vert</span> </a>  
      <!-- <span class="material-symbols-outlined closeBTN">close</span> -->
      </div>
    </div>

    <div class="chatbody">

      <!-- MENSAJE TUYO Y DEL OTRO DE BASE -->
      <div class="othermsg chatmsg">
        <p>Hola</p>
        <span>20:30</span>
        <a class="responseBTN"> <span class="material-symbols-outlined">redo</span> </a>
      </div>

      <div class="yourmsg chatmsg responsemsg">
        <p>Hola, buen dia</p>
        <span>20:32</span>
        <a class="responseBTN"> <span class="material-symbols-outlined">redo</span> </a>
      </div>
      <div class="yourmsg chatmsg">
        <p>Como andas?</p>
        <span>20:33</span>
        <a class="responseBTN"> <span class="material-symbols-outlined">redo</span> </a>
      </div>

    </div>

    <div class="chatfoot">
      <a href=""> <span class="material-symbols-outlined">add_reaction</span> </a>
      <a href=""> <span class="material-symbols-outlined">attach_file</span></a>
      <form action="">
        <input type="text" placeholder="Escribe un mensaje...">
        <button type="submit" name="enviar"> <span class="material-symbols-outlined menu">send</span>  </button>
      </form>
    </div>

  </section>

</body>

</html>
